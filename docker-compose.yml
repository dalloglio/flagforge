services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://flagforge:flagforge@postgres:5432/flagforge
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flagforge
      POSTGRES_USER: flagforge
      POSTGRES_PASSWORD: flagforge
    volumes:
      - flagforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagforge -d flagforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: flagforge_test
      POSTGRES_USER: flagforge
      POSTGRES_PASSWORD: flagforge
    volumes:
      - flagforge-postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagforge -d flagforge_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flagforge-postgres-data:
  flagforge-postgres-test-data:
