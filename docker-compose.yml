services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      DATABASE_URL: postgres://flagforge:flagforge@postgres:5432/flagforge
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"

  kong:
    image: kong:3.9
    depends_on:
      - app
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
    volumes:
      - ./infra/kong/kong.yml:/kong/declarative/kong.yml:ro

  prometheus:
    image: prom/prometheus:v3.8.0
    depends_on:
      - app
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - flagforge-prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.3.0
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  postgres:
    image: postgres:17-alpine
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: flagforge
      POSTGRES_USER: flagforge
      POSTGRES_PASSWORD: flagforge
    volumes:
      - flagforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagforge -d flagforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    ports:
      - "${TEST_DATABASE_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: flagforge_test
      POSTGRES_USER: flagforge
      POSTGRES_PASSWORD: flagforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagforge -d flagforge_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flagforge-postgres-data:
  flagforge-prometheus-data:
