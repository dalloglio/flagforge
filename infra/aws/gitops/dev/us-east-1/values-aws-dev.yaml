replicaCount: 2

image:
  repository: "<aws-account-id>.dkr.ecr.us-east-1.amazonaws.com/flagforge-api"
  tag: "<yyyymmdd>.<short-sha>"
  pullPolicy: IfNotPresent

containerPort: 3000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
  hosts:
    - host: flagforge-dev.example.invalid
      paths:
        - path: /
          pathType: Prefix
  tls: []

runtime:
  adminRateLimitRequests: "60"
  adminRateLimitWindowMs: "60000"

secret:
  create: false
  existingSecret: flagforge-api-runtime
  keys:
    databaseUrl: DATABASE_URL
    adminApiKey: ADMIN_API_KEY
  data:
    databaseUrl: ""
    adminApiKey: ""

livenessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /readyz
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
