apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flagforge-api-aws-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: flagforge-api
    app.kubernetes.io/part-of: flagforge
    flagforge.io/environment: dev
    flagforge.io/region: us-east-1
spec:
  project: default
  sources:
    - repoURL: https://github.com/dalloglio/flagforge.git
      targetRevision: main
      path: charts/flagforge-api
      helm:
        releaseName: flagforge-api
        valueFiles:
          - $values/infra/aws/gitops/dev/us-east-1/values-aws-dev.yaml
    - repoURL: https://github.com/dalloglio/flagforge.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: flagforge
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
