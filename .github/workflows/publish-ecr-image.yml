name: Publish ECR Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-ecr-image-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: flagforge-api
  AWS_ROLE_NAME: flagforge-github-actions-ecr-publisher-dev

jobs:
  publish:
    name: Build, scan, and publish image
    runs-on: ubuntu-latest
    if: vars.ECR_PUBLISHING_ENABLED == 'true'
    environment: aws-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${AWS_ACCOUNT_ID:-}" ]]; then
            echo "AWS_ACCOUNT_ID repository or environment variable is required when ECR publishing is enabled." >&2
            exit 1
          fi

          echo "::add-mask::${AWS_ACCOUNT_ID}"

          short_sha="${GITHUB_SHA::7}"
          image_tag="$(date -u +%Y%m%d).${short_sha}"
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image_uri="${registry}/${ECR_REPOSITORY}:${image_tag}"

          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "IMAGE_TAG=${image_tag}" >> "${GITHUB_ENV}"
          echo "IMAGE_URI=${image_uri}" >> "${GITHUB_ENV}"
          echo "ECR_REGISTRY=${registry}" >> "${GITHUB_ENV}"
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Build image
        run: |
          docker build \
            -t "${ECR_REPOSITORY}:${IMAGE_TAG}" \
            -t "${IMAGE_URI}" \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.image_tag }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_NAME }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Push image
        run: docker push "${IMAGE_URI}"

      - name: Publish summary
        run: |
          {
            echo "Published FlagForge API image"
            echo ""
            echo "- Repository: ${ECR_REPOSITORY}"
            echo "- Region: ${AWS_REGION}"
            echo "- Tag: ${IMAGE_TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"
